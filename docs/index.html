* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sea);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#app {
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
#panel {
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
}
#map {
  background: var(--sea);
  min-height: 0;
}

/* ---- panel: header ---- */
.hd { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.eyebrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3);
}
.eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
.eyebrow .new { color: var(--accent); }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 27px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 10px 0 8px;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 34em; }
/* ---- map overlays: language switcher (top-right) and legend (bottom-left) ---- */
.ov { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow); }
.lang { display: inline-flex; gap: 2px; padding: 3px; }
.lang button {
  border: 0; background: transparent; padding: 4px 10px; border-radius: 4px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.lang button:hover:not([aria-pressed="true"]) { color: var(--ink); background: var(--panel-2); }

.lg { padding: 10px 12px 8px; width: 500px; max-width: calc(100vw - 24px); }
.lg-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.lg-base { display: inline-flex; gap: 2px; padding: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; flex: none; }
.lg-base button { border: 0; background: transparent; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.lg-base button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.lg-base button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.lg-h .t { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.lg-h .n { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.lg-body { display: flex; align-items: flex-start; gap: 12px; }
.lg-ramp { flex: 1; min-width: 0; position: relative; }
.lg-bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-bottom: 18px; }
.lg-bar span { height: 20px; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lg-bar .b4 { background: var(--b4); color: #fff; } .lg-bar .b3 { background: var(--b3); color: #fff; }
.lg-bar .b2 { background: var(--b2); color: #fff; } .lg-bar .b1 { background: var(--b1); color: #171b22; }
.lg-bar .n0 { background: var(--n0); color: var(--ink); }
.lg-bar .a1 { background: var(--a1); color: #171b22; } .lg-bar .a2 { background: var(--a2); color: #fff; } .lg-bar .a3 { background: var(--a3); color: #fff; }
.lg-ticks { position: absolute; left: 0; right: 0; top: 23px; height: 14px; }
.lg-ticks span { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
.lg-ticks span::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 3px; background: var(--line-2); }
.lg-ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); }
.lg-ends .n { color: var(--ink-3); }
.lg-side { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: 92px; flex: none; }
.lg-nd { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.lg-rg { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.lg-rg .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--a2); box-shadow: 0 0 0 1.5px #fff; }
.lg-rg[aria-pressed="false"] { color: var(--ink-3); }
.lg-rg[aria-pressed="false"] .dot { background: var(--nd); border: 1px dashed var(--stroke-nd); box-shadow: none; }
.lg-nd .sw { width: 100%; height: 20px; border-radius: 2px; background: var(--nd); border: 1px dashed var(--stroke-nd); }
.lg-nd .lb { font-size: 10.5px; color: var(--ink-2); text-align: center; line-height: 1.15; }
.leaflet-top.leaflet-right .leaflet-control { margin-top: 10px; margin-right: 10px; }
.leaflet-bottom.leaflet-left .leaflet-control { margin-bottom: 10px; margin-left: 10px; }
.leaflet-control.ov { border: 1px solid var(--line-2); }

/* ---- EU average strip ---- */
.avg { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.avg > div { padding: 10px 8px 10px 22px; border-right: 1px solid var(--line); border-top: 1px solid var(--line); min-width: 0; }
.avg > div.main { grid-column: 1 / -1; border-right: 0; border-top: 0; display: flex; align-items: baseline; gap: 10px; padding-top: 11px; padding-bottom: 8px; }
.avg > div:last-child { border-right: 0; }
.avg .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); line-height: 1.25; }
.avg .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.avg .v.big { font-size: 28px; color: var(--accent); margin-top: 0; }
.avg .main .k { flex: 1; }

/* ---- sections ---- */
section { padding: 14px 22px; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
h2 {
  margin: 0 0 10px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-3); }

/* ---- Top / bottom widget ---- */
.tb { display: grid; gap: 10px; }
.scope { display: inline-flex; gap: 2px; padding: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; justify-self: start; }
.scope button { border: 0; background: transparent; padding: 3px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.scope button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.scope button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.row .nm small { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; margin-top: 1px; }
.tb h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.tb h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tb h3 .mk { width: 10px; height: 10px; border-radius: 2px; }
.tb h3 .mk.up { background: var(--a3); }
.tb h3 .mk.dn { background: var(--b4); }
.rows { display: grid; gap: 2px; }
.row {
  display: grid; grid-template-columns: 18px 30px 1fr auto auto; align-items: center; gap: 8px;
  text-align: left; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);
  border: 0; background: transparent; border-radius: 6px; cursor: pointer;
}
.row:hover, .row.is-active { background: var(--panel-2); }
.row .rk { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-3); text-align: center; }
.row .fl { width: 30px; height: 22.5px; border-radius: 2px; object-fit: cover; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); display: block; }
.row .nm { font-weight: 500; font-size: 13px; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
.row .sc { font-family: var(--font-display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.up { background: var(--pill-up-bg); color: var(--pill-up-fg); }
.pill.dn { background: var(--pill-dn-bg); color: var(--pill-dn-fg); }
.pill.n { background: var(--pill-n-bg); color: var(--pill-n-fg); }

/* ---- global context charts ---- */
.global svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.global .grid { stroke: var(--line); stroke-width: 1; }
.global .ref { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; }
.global .stem { stroke: var(--line-2); stroke-width: 1.5; }
.global .tick { font: 10px var(--font-body); fill: var(--ink-3); }
.global .lbl { font: 11.5px var(--font-body); fill: var(--ink-2); }
.global .lbl.eu { font-weight: 600; fill: var(--ink); }
.global .dot { fill: var(--ink-3); stroke: var(--panel); stroke-width: 1.5; }
.global .dot.eu { fill: var(--accent); }
.global .dot.eur { fill: var(--a1); }
.global .val { font: 600 11.5px var(--font-body); fill: var(--ink); font-variant-numeric: tabular-nums; }
.global .dlt { font: 600 10.5px var(--font-body); font-variant-numeric: tabular-nums; }
.global .dlt.up { fill: var(--pill-up-fg); } .global .dlt.dn { fill: var(--pill-dn-fg); } .global .dlt.n { fill: var(--ink-3); }
.global .chart-foot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.global .note { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); }
.global .sub-h { margin: 14px 0 6px; }
.global .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.global .ln.eu, .global .pt.eu { stroke: var(--accent); }
.global .ln.ea, .global .pt.ea { stroke: var(--b3); }
.global .ln.us, .global .pt.us { stroke: #1baf7a; }
.global .ln.oecd, .global .pt.oecd { stroke: var(--ink-3); stroke-dasharray: 4 3; }
.global .pt { fill: var(--panel); stroke-width: 1.8; }
.global .pt.eu { fill: var(--accent); }
.global .ln-lbl { font: 600 10.5px var(--font-body); }
.global .ln-lbl.eu { fill: var(--accent); } .global .ln-lbl.ea { fill: var(--b3); } .global .ln-lbl.us { fill: #1baf7a; } .global .ln-lbl.oecd { fill: var(--ink-3); }

/* ---- method / sources ---- */
.method p { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); }
.method p:last-child { margin-bottom: 0; }
.method a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
.method a:hover { border-bottom-color: currentColor; }
.method .src { font-size: 11.5px; color: var(--ink-3); }

/* ---- map paths (styled via tokens so both themes apply) ---- */
.leaflet-container { background: var(--sea); font-family: var(--font-body); }
path.cty { stroke: var(--stroke); stroke-width: 0.8; stroke-opacity: 1; fill-opacity: 1; transition: fill-opacity .12s ease; }
path.cty.nd { fill: var(--nd); stroke: var(--stroke-nd); stroke-width: 0.6; }
path.n0 { fill: var(--n0); }
path.a1 { fill: var(--a1); } path.a2 { fill: var(--a2); } path.a3 { fill: var(--a3); }
path.b1 { fill: var(--b1); } path.b2 { fill: var(--b2); } path.b3 { fill: var(--b3); } path.b4 { fill: var(--b4); }
path.rg { stroke: #fff; stroke-width: 1.4; fill-opacity: 1; cursor: pointer; }
path.rg.is-hover { stroke: var(--stroke-hover); stroke-width: 2.2; }
path.cty.is-hover, path.cty.is-active { stroke: var(--stroke-hover); stroke-width: 1.8; }
path.cty.has-data { cursor: pointer; }

.leaflet-bar { border: 1px solid var(--line-2) !important; box-shadow: var(--shadow) !important; border-radius: 6px !important; overflow: hidden; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-bottom-color: var(--line) !important; }
.leaflet-bar a:hover { background: var(--panel-2) !important; }
.leaflet-bar a.leaflet-disabled { color: var(--ink-3) !important; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--ink-3) !important; font-size: 10.5px !important; padding: 2px 6px !important; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-tooltip { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); box-shadow: var(--shadow); border-radius: 5px; padding: 5px 9px; font-size: 12.5px; font-weight: 500; }
.leaflet-tooltip::before { display: none; }
.leaflet-tooltip b { font-family: var(--font-display); font-size: 14px; font-weight: 700; }

.leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 0; overflow: hidden; }
.leaflet-popup-content { margin: 0; width: 320px !important; font-size: 13px; line-height: 1.4; }
.leaflet-popup-tip { background: var(--panel); box-shadow: none; border: 1px solid var(--line); border-top: 0; border-left: 0; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink-3); top: 8px; right: 8px; font-size: 20px; width: 22px; height: 22px; }
.leaflet-container a.leaflet-popup-close-button:hover { color: var(--ink); }

.pp-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }

.pp-h .t { min-width: 0; }
.pp-h .nm { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; }
.pp-h .tag { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
.pp-hero { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 12px; padding: 10px 14px 8px; }
.pp-hero .big { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.pp-hero .lbl { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.pp-hero .dv { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-bottom: 2px; }
.pp-hero .rank { font-size: 12px; color: var(--ink-2); }
.pp-t { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 2px 0 0; }
.pp-t th, .pp-t td { width: 60px; }
.pp-t th:first-child, .pp-t td:first-child { width: auto; }
.pp-t th { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding: 4px 10px 4px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; overflow: hidden; }
.pp-t th:first-child { text-align: left; padding-left: 14px; }
.pp-t th:last-child, .pp-t td:last-child { padding-right: 14px; }
.pp-t td { padding: 5px 10px 5px 0; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pp-t td:first-child { text-align: left; padding-left: 14px; color: var(--ink-2); white-space: normal; }
.pp-t tr:last-child td { border-bottom: 0; }
.pp-t td.sc { font-weight: 600; }
.pp-t .up { color: var(--pill-up-fg); } .pp-t .dn { color: var(--pill-dn-fg); } .pp-t .n { color: var(--ink-3); }
.pp-f { padding: 8px 14px 10px; font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--line); }
.pp-f p { margin: 0; }
.pp-f p + p { margin-top: 3px; }

/* ---- responsive ---- */
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 56vh minmax(0, 1fr); height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
  #map { grid-row: 1; height: 56vh; }
  #panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
  .hd { padding: 16px 18px 14px; }
  h1 { font-size: 26px; }
  section { padding: 14px 18px; }
  .avg > div { padding-left: 18px; }
  .avg > div + div { padding-left: 10px; }
  .leaflet-popup-content { width: 270px !important; }
}
@media (prefers-reduced-motion: reduce) {
  path.cty { transition: none; }
  .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; }
}

    lab.forEach(function (l) {
      var s = l.s, last = s.v[s.v.length - 1];
      var tl = s.id === 'eu' ? 'EU (23)' : (SHORT[s.id] || s.n)[NAME_IDX[lang]];
      h += '<text class="ln-lbl ' + s.id + '" x="' + (TW - PR + 6) + '" y="' + (l.y + 3.5) + '">' + tl + ' ' + fmt(last, 0) + '</text>';
    });
    h += '</svg>';
    h += '<p class="note">' + T('trendNote') + '</p>';
    el.innerHTML = h;
  }

  // ---- popups ------------------------------------------------------------------
  function domainRows(scores, dlt, thirdLabel, thirdVals) {
    var b = B(), keys = ['math', 'read', 'sci'], bv = [b.m, b.r, b.s];
    var h = '<table class="pp-t"><thead><tr><th>' + T('domain') + '</th><th>' + T('score') + '</th><th>Δ ' + T('baseShort')[base] + '</th><th>' + thirdLabel + '</th></tr></thead><tbody>';
    keys.forEach(function (k, i) {
      var sc = scores[i], dev = sc - bv[i], tv = thirdVals ? thirdVals[i] : null;
      h += '<tr><td>' + T(k) + '</td><td class="sc">' + fmt(sc, 0) + '</td>' +
        '<td class="' + pillCls(dev, 5) + '">' + signed(dev, 0) + '</td>' +
        '<td class="' + (tv === null ? 'n' : pillCls(tv, 3)) + '">' + (tv === null ? '–' : signed(tv, 0)) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }
  function popupHtml(k) {
    var d = D[k], isEU = EU27.indexOf(k) >= 0, dev = devOf(d.c);
    var h = '<div class="pp-h"><img src="' + FLAGS[k] + '" alt=""><div class="t"><div class="nm">' + nameOf(k) + '</div>' +
      '<div class="tag">' + (isEU ? T('euMember') : T('nonEU')) + '</div></div></div>';
    h += '<div class="pp-hero"><div><div class="lbl">' + T('composite') + '</div><div class="big">' + fmt(d.c, 1) + '</div></div>' +
      '<div class="dv"><span class="pill ' + pillCls(dev, 5) + '">' + signed(dev, 1) + ' · ' + T('baseShort')[base] + '</span>' +
      '<span class="rank">' + (isEU ? T('rankEU') + ' ' + d.rankEU + T('of') + EU27.length + ' · ' : '') + T('rankEurope') + ' ' + d.rankEurope + T('of') + isos.length + '</span></div></div>';
    h += domainRows(d.s, null, 'Δ 2022', d.d);
    var notes = [];
    if (d.note === '*' || d.note === '*nochange') notes.push(T('noteStar'));
    if (d.note === '*nochange') notes.push(T('noteNoChange'));
    if (d.note === 'partial') notes.push(T('notePartial'));
    if (d.note === 'no2022') notes.push(T('noteNo2022'));
    if (d.note === 'baku2022') notes.push(T('noteBaku'));
    if (notes.length) h += '<div class="pp-f">' + notes.map(function (n) { return '<p>' + n + '</p>'; }).join('') + '</div>';
    return h;
  }
  function regionPopupHtml(r) {
    var nat = D[r.iso], dev = devOf(r.c);
    var h = '<div class="pp-h"><img src="' + FLAGS[r.iso] + '" alt=""><div class="t"><div class="nm">' + rname(r) + '</div>' +
      '<div class="tag">' + T('regionOf').replace('{c}', nameOf(r.iso)) + '</div></div></div>';
    h += '<div class="pp-hero"><div><div class="lbl">' + T('composite') + '</div><div class="big">' + fmt(r.c, 1) + '</div></div>' +
      '<div class="dv"><span class="pill ' + pillCls(dev, 5) + '">' + signed(dev, 1) + ' · ' + T('baseShort')[base] + '</span>' +
      '<span class="rank">' + T('national') + ': ' + fmt(nat.c, 1) + ' (' + signed(r.c - nat.c, 1) + ')</span></div></div>';
    h += domainRows(r.s, null, T('vsNat'), [r.s[0] - nat.s[0], r.s[1] - nat.s[1], r.s[2] - nat.s[2]]);
    var notes = [T('noteSE') + r.se.join(' / ')];
    if (r.note === '*') notes.unshift(T('noteStar'));
    h += '<div class="pp-f">' + notes.map(function (n) { return '<p>' + n + '</p>'; }).join('') + '</div>';
    return h;
  }

  // ---- map -----------------------------------------------------------------
  var map = L.map('map', {
    zoomControl: true, attributionControl: true, minZoom: 3, maxZoom: 8, zoomSnap: 0.1, zoomDelta: 0.5,
    wheelPxPerZoomLevel: 90, maxBounds: [[27, -32], [74, 80]], maxBoundsViscosity: 0.7
  });
  map.attributionControl.setPrefix(false);
  var layers = {};
  var activeIso = null, activeRegion = null;
  var geo = L.geoJSON(GEO, {
    style: function (f) {
      var k = f.properties.iso, d = D[k];
      return { className: 'cty ' + (d ? d.cls + ' has-data' : 'nd'), weight: 0.8, fillOpacity: 1 };
    },
    onEachFeature: function (f, layer) {
      var k = f.properties.iso;
      if (!D[k]) return;
      layers[k] = layer;
      layer.on('mouseover', function () { setHover(k, true); });
      layer.on('mouseout', function () { setHover(k, false); });
      layer.on('click', function (e) { openFor(k, e.latlng); });
      layer.bindTooltip(function () { return '<b>' + nameOf(k) + '</b> · ' + fmt(D[k].c, 1) + ' (' + signed(devOf(D[k].c), 1) + ')'; }, { sticky: true, direction: 'top', opacity: 1 });
    }
  }).addTo(map);
  function el(k) { return layers[k] && layers[k].getElement ? layers[k].getElement() : null; }
  function setHover(k, on) {
    var e = el(k); if (!e) return;
    if (on) { e.classList.add('is-hover'); layers[k].bringToFront(); }
    else { e.classList.remove('is-hover'); }
    document.querySelectorAll('.row[data-iso="' + k + '"]').forEach(function (b) { b.classList.toggle('is-active', on); });
  }
  function setActive(k) {
    if (activeIso && el(activeIso)) el(activeIso).classList.remove('is-active');
    activeIso = k;
    if (k && el(k)) { el(k).classList.add('is-active'); layers[k].bringToFront(); }
  }
  var popup = L.popup({ maxWidth: 320, minWidth: 260, autoPanPadding: [24, 24], closeButton: true });
  function openFor(k, latlng) {
    setActive(k); activeRegion = null;
    popup.setLatLng(latlng || layers[k].getBounds().getCenter()).setContent(popupHtml(k)).openOn(map);
  }
  map.on('popupclose', function () { setActive(null); activeRegion = null; });
  function focusCountry(k) {
    var p = layers[k].feature.properties;
    var b = p.bb ? L.latLngBounds(p.bb) : layers[k].getBounds();
    map.flyToBounds(b, { padding: [40, 40], maxZoom: 5.5, duration: 0.7 });
    map.once('moveend', function () { openFor(k, anchorOf(k)); });
  }
  function anchorOf(k) {
    var p = layers[k].feature.properties;
    return p.c ? L.latLng(p.c[0], p.c[1]) : layers[k].getBounds().getCenter();
  }

  // ---- regions (sub-national results, OECD Annex B2) -------------------------
  var showRegions = true;
  try { var sr = localStorage.getItem('pisa2025-regions'); if (sr === '0') showRegions = false; } catch (e) {}
  // Regions get their own pane above the country polygons, so bringToFront() on a hovered country never covers them.
  map.createPane('regions').style.zIndex = 450;
  var regionLayer = L.layerGroup();
  RG.forEach(function (r) {
    var m = L.circleMarker(r.ll, { pane: 'regions', radius: 6, className: 'rg ' + r.cls, weight: 1.2, fillOpacity: 1, bubblingMouseEvents: false });
    r.marker = m;
    m.on('mouseover', function () { var e = m.getElement(); if (e) e.classList.add('is-hover'); });
    m.on('mouseout', function () { var e = m.getElement(); if (e) e.classList.remove('is-hover'); });
    m.on('click', function () { openRegion(r); });
    m.bindTooltip(function () { return '<b>' + rname(r) + '</b> · ' + fmt(r.c, 1) + ' (' + signed(devOf(r.c), 1) + ')'; }, { sticky: true, direction: 'top', opacity: 1 });
    regionLayer.addLayer(m);
  });
  function openRegion(r) {
    setActive(null); activeRegion = r;
    popup.setLatLng(r.ll).setContent(regionPopupHtml(r)).openOn(map);
  }
  function setRegions(on) {
    showRegions = on;
    if (on) regionLayer.addTo(map); else map.removeLayer(regionLayer);
    try { localStorage.setItem('pisa2025-regions', on ? '1' : '0'); } catch (e) {}
    var b = document.querySelector('.lg-rg'); if (b) b.setAttribute('aria-pressed', String(on));
  }
  if (showRegions) regionLayer.addTo(map);

  // ---- baseline switching ----------------------------------------------------
  function setBase(b) {
    if (!BASES[b] || b === base) return;
    base = b;
    try { localStorage.setItem('pisa2025-base', b); } catch (e) {}
    recount();
    isos.forEach(function (k) {
      var e = el(k); if (!e) return;
      CLASSES.forEach(function (c) { e.classList.remove(c); });
      e.classList.add(D[k].cls);
    });
    RG.forEach(function (r) {
      var e = r.marker.getElement(); if (!e) return;
      CLASSES.forEach(function (c) { e.classList.remove(c); });
      e.classList.add(r.cls);
    });
    renderAll();
  }

  // Language switcher and legend live on the map as Leaflet controls.
  var LangCtl = L.Control.extend({
    onAdd: function () {
      var c = L.DomUtil.create('div', 'lang ov');
      c.setAttribute('role', 'group'); c.setAttribute('aria-label', 'Language');
      c.innerHTML = '<button type="button" data-lang="hu" aria-pressed="true">HU</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="de" aria-pressed="false">DE</button>';
      L.DomEvent.disableClickPropagation(c); L.DomEvent.disableScrollPropagation(c);
      return c;
    }
  });
  var LegendCtl = L.Control.extend({
    onAdd: function () {
      var c = L.DomUtil.create('div', 'lg ov');
      c.id = 'legend';
      L.DomEvent.disableClickPropagation(c); L.DomEvent.disableScrollPropagation(c);
      return c;
    }
  });
  new LangCtl({ position: 'topright' }).addTo(map);
  new LegendCtl({ position: 'bottomleft' }).addTo(map);

  function euBounds() {
    var b = null;
    EU27.forEach(function (k) {
      var p = layers[k] && layers[k].feature.properties;
      if (!p || !p.bb) return;
      var lb = L.latLngBounds(p.bb);
      b = b ? b.extend(lb) : lb;
    });
    return b || L.latLngBounds([[34.5, -11], [71.5, 41]]);
  }
  function fitEU() {
    var small = map.getSize().x < 700;
    map.fitBounds(euBounds(), { paddingTopLeft: [12, small ? 12 : 16], paddingBottomRight: [12, small ? 100 : 104] });
  }
  fitEU();
  var currentAttr = '';

  // ---- language switching --------------------------------------------------
  function renderAll() {
    renderStatic(); renderAvg(); renderLegend(); renderGlobal(); renderTB();
    if (currentAttr) map.attributionControl.removeAttribution(currentAttr);
    currentAttr = T('attribution');
    map.attributionControl.addAttribution(currentAttr);
    if (map.hasLayer(popup)) {
      if (activeRegion) popup.setContent(regionPopupHtml(activeRegion));
      else if (activeIso) popup.setContent(popupHtml(activeIso));
    }
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('pisa2025-lang', lang); } catch (e) {}
      renderAll();
    });
  });
  renderAll();
  window.__pisa = { map: map, layers: layers, focusCountry: focusCountry, openFor: openFor, anchorOf: anchorOf, fitEU: fitEU, setBase: setBase, setRegions: setRegions, openRegion: openRegion, regions: RG };
})();
</script>

</body>
</html>
