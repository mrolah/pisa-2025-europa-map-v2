* { box-sizing: border-box; }
html, body { height: 100%; }

  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
#panel {

.lg-ticks { position: absolute; left: 0; right: 0; top: 23px; height: 14px; }

.lg-nd { display: flex; flex-direction: column; align-items: center; gap: 3px; }

.global .ln-lbl.eu { fill: var(--accent); } .global .ln-lbl.ea { fill: var(--b3); } .global .ln-lbl.us { fill: #1baf7a; } .global .ln-lbl.oecd { fill: var(--ink-3); }

    el.innerHTML = html;
    document.querySelector('[data-i18n="tbSub"]').textContent = T(scope === 'eu' ? 'tbSub' : 'tbSubAll');
    el.querySelectorAll('.row').forEach(function (b) {
      var k = b.getAttribute('data-iso');
      b.addEventListener('click', function () { focusCountry(k); });
      b.addEventListener('mouseenter', function () { setHover(k, true); });
      b.addEventListener('mouseleave', function () { setHover(k, false); });
    });
    el.querySelectorAll('.scope button').forEach(function (b) {
      b.addEventListener('click', function () { scope = b.getAttribute('data-scope'); renderTB(); });
    });
  }

  // ---- global context: dot plot of blocs + trend lines ----------------------
  function renderGlobal() {
    var el = document.getElementById('global');
    var SHORT = { cn: ['B‑S‑J‑Z (CN)', 'B‑S‑J‑Z (CN)', 'B‑S‑J‑Z (CN)'], ea: ['East Asia 6', 'Kelet‑Ázsia 6', 'Ostasien 6'], ang: ['Anglosphere 5', 'Angolszász 5', 'Anglosphäre 5'], us: ['United States', 'Egyesült Államok', 'USA'], oecd: ['OECD average', 'OECD‑átlag', 'OECD‑Schnitt'], eu: ['EU‑27', 'EU‑27', 'EU‑27'], eur: ['Europe 43', 'Európa 43', 'Europa 43'], sea: ['SE Asia 7', 'DK‑Ázsia 7', 'SO‑Asien 7'], me: ['Middle East 8', 'Közel‑Kelet 8', 'Naher Osten 8'], la: ['Latin America 13', 'Latin‑Amerika 13', 'Lateinamerika 13'], ca: ['Central Asia 4', 'Közép‑Ázsia 4', 'Zentralasien 4'], af: ['Africa 5', 'Afrika 5', 'Afrika 5'] };
    var W = 316, LW = 112, VW = 40, DW = 42, X0 = LW, XW = W - LW - VW - DW, RH = 21;
    var lo = 330, hi = 600;
    var x = function (v) { return X0 + (v - lo) / (hi - lo) * XW; };
    var euC = EU.c;
    var h = '<svg class="dots" viewBox="0 0 ' + W + ' ' + (BL.blocs.length * RH + 22) + '" width="' + W + '" role="img" aria-label="' + T('globalTitle') + '">';
    [400, 500].forEach(function (v) {
      h += '<line class="grid" x1="' + x(v) + '" y1="4" x2="' + x(v) + '" y2="' + (BL.blocs.length * RH + 4) + '"/>' +
        '<text class="tick" x="' + x(v) + '" y="' + (BL.blocs.length * RH + 18) + '" text-anchor="middle">' + v + '</text>';
    });
    h += '<line class="ref" x1="' + x(euC) + '" y1="2" x2="' + x(euC) + '" y2="' + (BL.blocs.length * RH + 6) + '"/>';
    BL.blocs.forEach(function (b, i) {
      var cy = i * RH + 14, isEU = b.id === 'eu', isEur = b.id === 'eur';
      h += '<text class="lbl' + (isEU ? ' eu' : '') + '" x="' + (LW - 8) + '" y="' + (cy + 4) + '" text-anchor="end">' + (SHORT[b.id] || b.n)[NAME_IDX[lang]] + '<title>' + b.n[NAME_IDX[lang]] + '</title></text>';
      h += '<line class="stem" x1="' + x(euC) + '" y1="' + cy + '" x2="' + x(b.c) + '" y2="' + cy + '"/>';
      h += '<circle class="dot' + (isEU ? ' eu' : (isEur ? ' eur' : '')) + '" cx="' + x(b.c) + '" cy="' + cy + '" r="' + (isEU ? 5 : 4) + '"><title>' + b.n[NAME_IDX[lang]] + ': ' + fmt(b.c, 1) + '</title></circle>';
      h += '<text class="val" x="' + (W - DW - 2) + '" y="' + (cy + 4) + '" text-anchor="end">' + fmt(b.c, 1) + '</text>';
      h += '<text class="dlt ' + (b.d === null ? 'n' : pillCls(b.d, 2)) + '" x="' + (W - 1) + '" y="' + (cy + 4) + '" text-anchor="end">' + (b.d === null ? '·' : signed(b.d, 1)) + '</text>';
    });
    h += '</svg>';
    h += '<div class="chart-foot"><span>' + T('composite') + ' 2025</span><span>' + T('d2225') + '</span></div>';
    h += '<p class="note">' + T('globalNote') + '</p>';
    // trend
    var tr = BL.trend, TW = 316, TH = 150, PL = 30, PR = 104, PT = 10, PB = 22;
    var ylo = 460, yhi = 545;
    var tx = function (y) { return PL + (y - 2012) / (2025 - 2012) * (TW - PL - PR); };
    var ty = function (v) { return PT + (yhi - v) / (yhi - ylo) * (TH - PT - PB); };
    h += '<h2 class="sub-h"><span>' + T('trendTitle') + '</span> <span class="sub">' + T('trendSub') + '</span></h2>';
    h += '<svg class="trend" viewBox="0 0 ' + TW + ' ' + TH + '" width="' + TW + '" role="img" aria-label="' + T('trendTitle') + '">';
    [470, 500, 530].forEach(function (v) { h += '<line class="grid" x1="' + PL + '" y1="' + ty(v) + '" x2="' + (TW - PR) + '" y2="' + ty(v) + '"/><text class="tick" x="' + (PL - 6) + '" y="' + (ty(v) + 3.5) + '" text-anchor="end">' + v + '</text>'; });
    tr.years.forEach(function (y) { h += '<text class="tick" x="' + tx(y) + '" y="' + (TH - 6) + '" text-anchor="middle">' + y + '</text>'; });
    var lab = tr.series.map(function (s) { return { s: s, y: ty(s.v[s.v.length - 1]) }; }).sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < lab.length; i++) { if (lab[i].y - lab[i - 1].y < 12) lab[i].y = lab[i - 1].y + 12; }
    tr.series.forEach(function (s) {
      var pts = s.v.map(function (v, i) { return tx(tr.years[i]) + ',' + ty(v); }).join(' ');
      h += '<polyline class="ln ' + s.id + '" points="' + pts + '"/>';
      s.v.forEach(function (v, i) { h += '<circle class="pt ' + s.id + '" cx="' + tx(tr.years[i]) + '" cy="' + ty(v) + '" r="2.6"><title>' + s.n[NAME_IDX[lang]] + ' ' + tr.years[i] + ': ' + fmt(v, 1) + '</title></circle>'; });
    });
    lab.forEach(function (l) {
      var s = l.s, last = s.v[s.v.length - 1];
      var tl = s.id === 'eu' ? 'EU (23)' : (SHORT[s.id] || s.n)[NAME_IDX[lang]];
      h += '<text class="ln-lbl ' + s.id + '" x="' + (TW - PR + 6) + '" y="' + (l.y + 3.5) + '">' + tl + ' ' + fmt(last, 0) + '</text>';
    });
    h += '</svg>';
    h += '<p class="note">' + T('trendNote') + '</p>';
    el.innerHTML = h;
  }

  // ---- popups ------------------------------------------------------------------
  function domainRows(scores, dlt, thirdLabel, thirdVals) {
    var b = B(), keys = ['math', 'read', 'sci'], bv = [b.m, b.r, b.s];
    var h = '<table class="pp-t"><thead><tr><th>' + T('domain') + '</th><th>' + T('score') + '</th><th>Δ ' + T('baseShort')[base] + '</th><th>' + thirdLabel + '</th></tr></thead><tbody>';
    keys.forEach(function (k, i) {
      var sc = scores[i], dev = sc - bv[i], tv = thirdVals ? thirdVals[i] : null;
      h += '<tr><td>' + T(k) + '</td><td class="sc">' + fmt(sc, 0) + '</td>' +
        '<td class="' + pillCls(dev, 5) + '">' + signed(dev, 0) + '</td>' +
        '<td class="' + (tv === null ? 'n' : pillCls(tv, 3)) + '">' + (tv === null ? '–' : signed(tv, 0)) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }
  function popupHtml(k) {
    var d = D[k], isEU = EU27.indexOf(k) >= 0, dev = devOf(d.c);
    var h = '<div class="pp-h"><img src="' + FLAGS[k] + '" alt=""><div class="t"><div class="nm">' + nameOf(k) + '</div>' +
      '<div class="tag">' + (isEU ? T('euMember') : T('nonEU')) + '</div></div></div>';
    h += '<div class="pp-hero"><div><div class="lbl">' + T('composite') + '</div><div class="big">' + fmt(d.c, 1) + '</div></div>' +
      '<div class="dv"><span class="pill ' + pillCls(dev, 5) + '">' + signed(dev, 1) + ' · ' + T('baseShort')[base] + '</span>' +
      '<span class="rank">' + (isEU ? T('rankEU') + ' ' + d.rankEU + T('of') + EU27.length + ' · ' : '') + T('rankEurope') + ' ' + d.rankEurope + T('of') + isos.length + '</span></div></div>';
    h += domainRows(d.s, null, 'Δ 2022', d.d);
    var notes = [];
    if (d.note === '*' || d.note === '*nochange') notes.push(T('noteStar'));
    if (d.note === '*nochange') notes.push(T('noteNoChange'));
    if (d.note === 'partial') notes.push(T('notePartial'));
    if (d.note === 'no2022') notes.push(T('noteNo2022'));
    if (d.note === 'baku2022') notes.push(T('noteBaku'));
    if (notes.length) h += '<div class="pp-f">' + notes.map(function (n) { return '<p>' + n + '</p>'; }).join('') + '</div>';
    return h;
  }
  function regionPopupHtml(r) {
    var nat = D[r.iso], dev = devOf(r.c);
    var h = '<div class="pp-h"><img src="' + FLAGS[r.iso] + '" alt=""><div class="t"><div class="nm">' + rname(r) + '</div>' +
      '<div class="tag">' + T('regionOf').replace('{c}', nameOf(r.iso)) + '</div></div></div>';
    h += '<div class="pp-hero"><div><div class="lbl">' + T('composite') + '</div><div class="big">' + fmt(r.c, 1) + '</div></div>' +
      '<div class="dv"><span class="pill ' + pillCls(dev, 5) + '">' + signed(dev, 1) + ' · ' + T('baseShort')[base] + '</span>' +
      '<span class="rank">' + T('national') + ': ' + fmt(nat.c, 1) + ' (' + signed(r.c - nat.c, 1) + ')</span></div></div>';
    h += domainRows(r.s, null, T('vsNat'), [r.s[0] - nat.s[0], r.s[1] - nat.s[1], r.s[2] - nat.s[2]]);
    var notes = [T('noteSE') + r.se.join(' / ')];
    if (r.note === '*') notes.unshift(T('noteStar'));
    h += '<div class="pp-f">' + notes.map(function (n) { return '<p>' + n + '</p>'; }).join('') + '</div>';
    return h;
  }

  // ---- map -----------------------------------------------------------------
  var map = L.map('map', {
    zoomControl: true, attributionControl: true, minZoom: 3, maxZoom: 8, zoomSnap: 0.1, zoomDelta: 0.5,
    wheelPxPerZoomLevel: 90, maxBounds: [[27, -32], [74, 80]], maxBoundsViscosity: 0.7
  });
  map.attributionControl.setPrefix(false);
  var layers = {};
  var activeIso = null, activeRegion = null;
  var geo = L.geoJSON(GEO, {
    style: function (f) {
      var k = f.properties.iso, d = D[k];
      return { className: 'cty ' + (d ? d.cls + ' has-data' : 'nd'), weight: 0.8, fillOpacity: 1 };
    },
    onEachFeature: function (f, layer) {
      var k = f.properties.iso;
      if (!D[k]) return;
      layers[k] = layer;
      layer.on('mouseover', function () { setHover(k, true); });
      layer.on('mouseout', function () { setHover(k, false); });
      layer.on('click', function (e) { openFor(k, e.latlng); });
      layer.bindTooltip(function () { return '<b>' + nameOf(k) + '</b> · ' + fmt(D[k].c, 1) + ' (' + signed(devOf(D[k].c), 1) + ')'; }, { sticky: true, direction: 'top', opacity: 1 });
    }
  }).addTo(map);
  function el(k) { return layers[k] && layers[k].getElement ? layers[k].getElement() : null; }
  function setHover(k, on) {
    var e = el(k); if (!e) return;
    if (on) { e.classList.add('is-hover'); layers[k].bringToFront(); }
    else { e.classList.remove('is-hover'); }
    document.querySelectorAll('.row[data-iso="' + k + '"]').forEach(function (b) { b.classList.toggle('is-active', on); });
  }
  function setActive(k) {
    if (activeIso && el(activeIso)) el(activeIso).classList.remove('is-active');
    activeIso = k;
    if (k && el(k)) { el(k).classList.add('is-active'); layers[k].bringToFront(); }
  }
  var popup = L.popup({ maxWidth: 320, minWidth: 260, autoPanPadding: [24, 24], closeButton: true });
  function openFor(k, latlng) {
    setActive(k); activeRegion = null;
    popup.setLatLng(latlng || layers[k].getBounds().getCenter()).setContent(popupHtml(k)).openOn(map);
  }
  map.on('popupclose', function () { setActive(null); activeRegion = null; });
  function focusCountry(k) {
    var p = layers[k].feature.properties;
    var b = p.bb ? L.latLngBounds(p.bb) : layers[k].getBounds();
    map.flyToBounds(b, { padding: [40, 40], maxZoom: 5.5, duration: 0.7 });
    map.once('moveend', function () { openFor(k, anchorOf(k)); });
  }
  function anchorOf(k) {
    var p = layers[k].feature.properties;
    return p.c ? L.latLng(p.c[0], p.c[1]) : layers[k].getBounds().getCenter();
  }

  // ---- regions (sub-national results, OECD Annex B2) -------------------------
  var showRegions = true;
  try { var sr = localStorage.getItem('pisa2025-regions'); if (sr === '0') showRegions = false; } catch (e) {}
  // Regions get their own pane above the country polygons, so bringToFront() on a hovered country never covers them.
  map.createPane('regions').style.zIndex = 450;
  var regionLayer = L.layerGroup();
  RG.forEach(function (r) {
    var m = L.circleMarker(r.ll, { pane: 'regions', radius: 6, className: 'rg ' + r.cls, weight: 1.2, fillOpacity: 1, bubblingMouseEvents: false });
    r.marker = m;
    m.on('mouseover', function () { var e = m.getElement(); if (e) e.classList.add('is-hover'); });
    m.on('mouseout', function () { var e = m.getElement(); if (e) e.classList.remove('is-hover'); });
    m.on('click', function () { openRegion(r); });
    m.bindTooltip(function () { return '<b>' + rname(r) + '</b> · ' + fmt(r.c, 1) + ' (' + signed(devOf(r.c), 1) + ')'; }, { sticky: true, direction: 'top', opacity: 1 });
    regionLayer.addLayer(m);
  });
  function openRegion(r) {
    setActive(null); activeRegion = r;
    popup.setLatLng(r.ll).setContent(regionPopupHtml(r)).openOn(map);
  }
  function setRegions(on) {
    showRegions = on;
    if (on) regionLayer.addTo(map); else map.removeLayer(regionLayer);
    try { localStorage.setItem('pisa2025-regions', on ? '1' : '0'); } catch (e) {}
    var b = document.querySelector('.lg-rg'); if (b) b.setAttribute('aria-pressed', String(on));
  }
  if (showRegions) regionLayer.addTo(map);

  // ---- baseline switching ----------------------------------------------------
  function setBase(b) {
    if (!BASES[b] || b === base) return;
    base = b;
    try { localStorage.setItem('pisa2025-base', b); } catch (e) {}
    recount();
    isos.forEach(function (k) {
      var e = el(k); if (!e) return;
      CLASSES.forEach(function (c) { e.classList.remove(c); });
      e.classList.add(D[k].cls);
    });
    RG.forEach(function (r) {
      var e = r.marker.getElement(); if (!e) return;
      CLASSES.forEach(function (c) { e.classList.remove(c); });
      e.classList.add(r.cls);
    });
    renderAll();
  }

  // Language switcher and legend live on the map as Leaflet controls.
  var LangCtl = L.Control.extend({
    onAdd: function () {
      var c = L.DomUtil.create('div', 'lang ov');
      c.setAttribute('role', 'group'); c.setAttribute('aria-label', 'Language');
      c.innerHTML = '<button type="button" data-lang="hu" aria-pressed="true">HU</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="de" aria-pressed="false">DE</button>';
      L.DomEvent.disableClickPropagation(c); L.DomEvent.disableScrollPropagation(c);
      return c;
    }
  });
  var LegendCtl = L.Control.extend({
    onAdd: function () {
      var c = L.DomUtil.create('div', 'lg ov');
      c.id = 'legend';
      L.DomEvent.disableClickPropagation(c); L.DomEvent.disableScrollPropagation(c);
      return c;
    }
  });
  new LangCtl({ position: 'topright' }).addTo(map);
  new LegendCtl({ position: 'bottomleft' }).addTo(map);

  function euBounds() {
    var b = null;
    EU27.forEach(function (k) {
      var p = layers[k] && layers[k].feature.properties;
      if (!p || !p.bb) return;
      var lb = L.latLngBounds(p.bb);
      b = b ? b.extend(lb) : lb;
    });
    return b || L.latLngBounds([[34.5, -11], [71.5, 41]]);
  }
  function fitEU() {
    var small = map.getSize().x < 700;
    map.fitBounds(euBounds(), { paddingTopLeft: [12, small ? 12 : 16], paddingBottomRight: [12, small ? 100 : 104] });
  }
  fitEU();
  var currentAttr = '';

  // ---- language switching --------------------------------------------------
  function renderAll() {
    renderStatic(); renderAvg(); renderLegend(); renderGlobal(); renderTB();
    if (currentAttr) map.attributionControl.removeAttribution(currentAttr);
    currentAttr = T('attribution');
    map.attributionControl.addAttribution(currentAttr);
    if (map.hasLayer(popup)) {
      if (activeRegion) popup.setContent(regionPopupHtml(activeRegion));
      else if (activeIso) popup.setContent(popupHtml(activeIso));
    }
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('pisa2025-lang', lang); } catch (e) {}
      renderAll();
    });
  });
  renderAll();
  window.__pisa = { map: map, layers: layers, focusCountry: focusCountry, openFor: openFor, anchorOf: anchorOf, fitEU: fitEU, setBase: setBase, setRegions: setRegions, openRegion: openRegion, regions: RG };
})();
</script>
